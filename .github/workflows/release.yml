name: Auto-tag release

# Triggered by pushes to main. paths-ignore skips examples/docs/gitignore-only
# pushes — note this also skips pushes that change zero paths (empty commits).
# The bot's bump commit uses [skip ci] so this workflow doesn't loop on itself.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'examples/**'
      - '**.md'
      - '.gitignore'

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  wait-for-tests:
    name: Wait for Test workflow
    runs-on: ubuntu-latest
    steps:
      # "Unit tests" is the display name of the job in test.yml. The two must
      # stay in step: a regexp that matches nothing waits until the job times out.
      - name: Wait for unit tests
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-regexp: "Unit tests"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
          allowed-conclusions: success

  tag-and-publish:
    name: Bump, tag, publish
    needs: wait-for-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Compute next version
        id: ver
        run: |
          # package.json is the source of truth for the current version: every
          # release commit writes the released version back into it, so it is
          # never behind the newest tag on main.
          pkg=$(node -p "require('./package.json').version")
          current="$pkg"
          IFS='.' read -r MAJ MIN PAT <<< "$current"

          msg=$(git log -1 --pretty=%s ${{ github.sha }})
          # feat!:/fix!:/BREAKING CHANGE → major; feat:/feat(...) → minor; else patch.
          # Pre-1.0 semver convention: while MAJ is 0 the API is unstable, so a
          # breaking marker bumps minor instead of jumping straight to 1.0.0.
          # The first major release happens manually (tag v1.0.0 by hand) — this
          # workflow only takes over once the project is past 0.x.
          if [[ "$msg" == *"!:"* || "$msg" == *"BREAKING CHANGE"* ]]; then
            if [[ "$MAJ" == "0" ]]; then
              MIN=$((MIN+1)); PAT=0
            else
              MAJ=$((MAJ+1)); MIN=0; PAT=0
            fi
          elif [[ "$msg" == feat:* || "$msg" == feat\(* ]]; then
            MIN=$((MIN+1)); PAT=0
          else
            PAT=$((PAT+1))
          fi

          version="${MAJ}.${MIN}.${PAT}"
          # Never tag a version that is not strictly above package.json.
          if [[ "$version" == "$pkg" ]] || \
             [[ "$(printf '%s\n%s\n' "$pkg" "$version" | sort -V | tail -n1)" != "$version" ]]; then
            echo "Computed version $version is not above package.json version $pkg" >&2
            exit 1
          fi
          next="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next (from '$msg')"

      - name: Bump package.json
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

      # `npm run build` here is `tsc --noEmit && tsup`, so this both type-checks
      # the bumped tree and proves dist/ can be produced before anything is
      # tagged or pushed.
      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Commit, tag, push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release ${{ steps.ver.outputs.next }} [skip ci]"
          git tag "${{ steps.ver.outputs.next }}"
          git push origin main
          git push origin "${{ steps.ver.outputs.next }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          next="${{ steps.ver.outputs.next }}"
          for i in 1 2 3; do
            if gh release view "$next" >/dev/null 2>&1; then
              echo "Release $next already exists, skipping"
              exit 0
            fi
            if gh release create "$next" --title "$next" --generate-notes; then
              exit 0
            fi
            echo "gh release create attempt $i failed; sleeping 15s..."
            sleep 15
          done
          echo "Failed to create release after 3 attempts"
          exit 1

      # The `npm view` fast path is a cheap skip, but it reads npm's CDN-cached
      # registry front end, which was observed on 2026-09-07 returning 404 for
      # 2-5 minutes after a fully successful publish. So on a retry it can
      # wrongly report the version as missing and we republish. The publish
      # itself is the authority: npm answers a duplicate with E403 and
      # "You cannot publish over the previously published versions", which means
      # the version we wanted is on the registry — success, not a failure to
      # retry. Match that message rather than the bare E403 code, so a genuine
      # 403 (bad or unscoped token) still fails the workflow loudly.
      - name: Publish to npm
        if: ${{ env.HAS_NPM_TOKEN == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${{ steps.ver.outputs.version }}"
          pkg="@synonymdev/pubky-pulse-web"
          for i in 1 2 3; do
            if npm view "$pkg@$version" version >/dev/null 2>&1; then
              echo "$pkg@$version already on registry, skipping"
              exit 0
            fi
            if out=$(npm publish --access public 2>&1); then
              echo "$out"
              exit 0
            fi
            echo "$out"
            if grep -qiE 'cannot publish over|previously published version' <<< "$out"; then
              echo "$pkg@$version is already on the registry, treating as published"
              exit 0
            fi
            echo "npm publish attempt $i failed; sleeping 15s..."
            sleep 15
          done
          echo "Failed to publish after 3 attempts"
          exit 1
