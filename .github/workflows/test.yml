name: Test

on:
  push:
  pull_request:

# Only the newest run per branch/event matters; older ones are cancelled so a
# fast-moving branch does not queue up stale checks that the release workflow
# would then wait on.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job's display name is the check name that release.yml waits on with
  # check-regexp "Unit tests". Renaming it breaks the release workflow.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The tests do not build, so the build stays a separate step: it is what
      # catches a tsc type error or a tsup bundling failure before a release.
      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test
